[project]
name = "icml26-repro-muon"
version = "0.1.0"
description = "Reproduction of Delving into Muon and Beyond (arXiv 2602.04669, OpenReview xUQ0Gw11NL)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "tiktoken>=0.5",
    "datasets>=2.14",
    "tqdm>=4.65",
]

[tool.uv]
# CPU-only torch wheels (this campaign has no GPU): https://download.pytorch.org/whl/cpu
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repro"]
